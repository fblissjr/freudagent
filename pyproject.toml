[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freud-schema"
version = "0.30.1"
description = "Experiment harness for data-driven agent orchestration, grounded in Freudian archetypes"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "duckdb>=0.9.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.30.0",
]
local = [
    "httpx>=0.27.0",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    "mcp>=1.2",
]

[project.scripts]
freud-schema = "freud_schema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Anchors pytest's rootdir to this repo. Without this, rootdir inference
# walks up to the parent directory (which is itself a Python project) and
# test collection tries to import that project's packages.
testpaths = ["tests"]
addopts = "--import-mode=importlib"
