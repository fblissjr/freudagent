<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" width="960" height="468" role="img" aria-labelledby="t d">
  <title id="t">The approval gate</title>
  <desc id="d">An agent can draft a proposal, which a person approves before it becomes a new version. An agent cannot switch on a rule for itself: the write tools only create drafts, and drafts do not compile.</desc>

  <rect x="0" y="0" width="960" height="468" rx="16" fill="#0b1220"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="36" y="46" font-size="21" font-weight="600" fill="#e6edf7">The one step that stays human</text>

    <!-- allowed path -->
    <g>
      <rect x="36" y="105" width="126" height="66" rx="11" fill="#141d2f" stroke="#3a5a8f" stroke-width="1.5"/>
      <text x="99" y="144" font-size="14" font-weight="600" fill="#e6edf7" text-anchor="middle">the agent</text>

      <line x1="164" y1="138" x2="192" y2="138" stroke="#3b4c6b" stroke-width="2"/>
      <polygon points="200,138 190,133 190,143" fill="#3b4c6b"/>

      <rect x="202" y="105" width="164" height="66" rx="11" fill="#16233a" stroke="#2c3e5e"/>
      <text x="284" y="134" font-size="13.5" font-weight="600" fill="#c3d2ea" text-anchor="middle">drafts a proposal</text>
      <text x="284" y="154" font-size="12" fill="#8fa2c0" text-anchor="middle">with its evidence attached</text>

      <line x1="368" y1="138" x2="396" y2="138" stroke="#3b4c6b" stroke-width="2"/>
      <polygon points="404,138 394,133 394,143" fill="#3b4c6b"/>

      <rect x="406" y="96" width="170" height="84" rx="11" fill="#2a2113" stroke="#f5a524" stroke-width="2"/>
      <text x="491" y="127" font-size="14" font-weight="600" fill="#ffd68a" text-anchor="middle">a person approves</text>
      <text x="491" y="149" font-size="12" fill="#c79a45" text-anchor="middle">reads the evidence,</text>
      <text x="491" y="166" font-size="12" fill="#c79a45" text-anchor="middle">says yes or no</text>
      <rect x="406" y="96" width="170" height="84" rx="11" fill="none" stroke="#f5a524" stroke-width="2" opacity="0.5">
        <animate attributeName="opacity" values="0.55;0.05;0.55" dur="3s" repeatCount="indefinite"/>
      </rect>

      <line x1="578" y1="138" x2="606" y2="138" stroke="#3b4c6b" stroke-width="2"/>
      <polygon points="614,138 604,133 604,143" fill="#3b4c6b"/>

      <rect x="616" y="99" width="308" height="78" rx="11" fill="#16233a" stroke="#2c3e5e"/>
      <text x="770" y="126" font-size="13.5" font-weight="600" fill="#c3d2ea" text-anchor="middle">becomes a new version</text>
      <text x="770" y="147" font-size="12" fill="#8fa2c0" text-anchor="middle">compiled into a file the agent loads next run,</text>
      <text x="770" y="164" font-size="12" fill="#8fa2c0" text-anchor="middle">with the evidence and approval recorded in it</text>
    </g>

    <!-- blocked path -->
    <path d="M99 175 L99 300 L192 300" fill="none" stroke="#5a3340" stroke-width="2"/>
    <polygon points="200,300 190,295 190,305" fill="#5a3340"/>

    <rect x="202" y="268" width="238" height="64" rx="11" fill="#1a1016" stroke="#5a3340" stroke-dasharray="6 4"/>
    <text x="321" y="296" font-size="13.5" font-weight="600" fill="#d4a3b0" text-anchor="middle">agent switches a rule on</text>
    <text x="321" y="316" font-size="12" fill="#a3798a" text-anchor="middle">for its own next session</text>

    <line x1="168" y1="300" x2="196" y2="300" stroke="#5a3340" stroke-width="2"/>
    <circle cx="150" cy="300" r="4" fill="#e0607e">
      <animate attributeName="cx" values="150;172;172" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle cx="185" cy="300" r="21" fill="#2c1620" stroke="#e0607e" stroke-width="2.5"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.6s" repeatCount="indefinite"/>
      <line x1="178" y1="293" x2="192" y2="307" stroke="#e0607e" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="192" y1="293" x2="178" y2="307" stroke="#e0607e" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <text x="536" y="286" font-size="13.5" fill="#c9a3ad">No agent-callable tool can do this. They only ever create</text>
    <text x="536" y="306" font-size="13.5" fill="#c9a3ad">drafts, drafts never compile, and the approval tool always</text>
    <text x="536" y="326" font-size="13.5" fill="#c9a3ad">asks the person running the session first.</text>

    <rect x="36" y="374" width="888" height="72" rx="10" fill="#16233a" stroke="#2c3e5e"/>
    <text x="480" y="400" font-size="14" fill="#c3d2ea" text-anchor="middle">Automation reduces how much a person must look at. It never reduces how carefully they look.</text>
    <text x="480" y="426" font-size="12.5" fill="#8fa2c0" text-anchor="middle">This holds for tools that route through the gate. A raw connection or a widened allowlist is a separate risk, not covered here.</text>
  </g>
</svg>
