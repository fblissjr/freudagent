<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
  <title id="t">The whole loop, including where the signal comes from</title>
  <desc id="d">A source is registered and an agent run breaks the work down as it goes. The run emits two things: a record of what happened, and a sample pulled for review at a level a person can judge. From the record comes a comparison of prescribed against actual. From the sample comes a human judgment, labeled by who made it, which in turn seeds model-generated feedback. All four feed the detectors. Detectors produce a finding with typed evidence, which becomes a proposal, which a person approves or rejects. An approved proposal becomes a new version, is checked against work already judged correct, and compiles into the artifact the next run loads.</desc>

  <rect x="0" y="0" width="960" height="700" rx="16" fill="#0b1220"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="40" font-size="21" font-weight="600" fill="#e6edf7">The whole loop, signal included</text>
    <text x="40" y="64" font-size="13.5" fill="#8fa2c0">The six stages are the lower half. Everything above the detectors is what decides whether the loop compounds.</text>

    <!-- return corridor: compiled artifact feeds the next run -->
    <path d="M880 618 L922 618 L922 86 L365 86 L365 96" fill="none" stroke="#3b4c6b" stroke-width="1.8" stroke-dasharray="5 4"/>
    <polygon points="365,104 360,94 370,94" fill="#3b4c6b"/>
    <text x="640" y="80" font-size="11.5" fill="#7f92b0" text-anchor="middle">the next run loads it</text>

    <!-- row 1: source, run -->
    <rect x="40" y="104" width="170" height="62" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="125" y="141" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">source registered</text>

    <rect x="240" y="104" width="250" height="62" rx="11" fill="#1b2c4d" stroke="#4f8ef7" stroke-width="1.6"/>
    <text x="365" y="130" font-size="13.5" font-weight="600" fill="#cfe0ff" text-anchor="middle">agent run</text>
    <text x="365" y="149" font-size="12" fill="#94a6c4" text-anchor="middle">breaks work down as it goes</text>

    <path d="M210 135 L232 135" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="240,135 230,130 230,140" fill="#3b4c6b"/>

    <!-- run -> sampled -->
    <path d="M420 166 L420 182 L555 182 L555 188" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="555,196 550,186 560,186" fill="#3b4c6b"/>

    <!-- run -> recorded -->
    <path d="M300 166 L300 244 L140 244 L140 272" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="140,280 135,270 145,270" fill="#3b4c6b"/>

    <!-- row 2: sampling -->
    <rect x="430" y="196" width="250" height="62" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="555" y="222" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">sampled for review</text>
    <text x="555" y="241" font-size="12" fill="#94a6c4" text-anchor="middle">at a level someone can judge</text>

    <path d="M555 258 L555 272" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="555,280 550,270 560,270" fill="#3b4c6b"/>

    <!-- row 3: the four signal sources -->
    <rect x="40" y="280" width="200" height="70" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="140" y="310" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">run recorded</text>
    <text x="140" y="329" font-size="12" fill="#94a6c4" text-anchor="middle">steps, decisions, paths</text>

    <rect x="262" y="280" width="180" height="70" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="352" y="310" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">prescribed vs actual</text>
    <text x="352" y="329" font-size="12" fill="#94a6c4" text-anchor="middle">compared</text>

    <rect x="464" y="280" width="190" height="70" rx="11" fill="#2a2113" stroke="#f5a524" stroke-width="1.6"/>
    <text x="559" y="310" font-size="13" font-weight="600" fill="#ffd68a" text-anchor="middle">judgment</text>
    <text x="559" y="329" font-size="12" fill="#c79a45" text-anchor="middle">labeled by who judged</text>

    <rect x="676" y="280" width="204" height="70" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="778" y="310" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">model-generated feedback</text>
    <text x="778" y="329" font-size="12" fill="#94a6c4" text-anchor="middle">seeded from the human slice</text>

    <path d="M240 315 L254 315" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="262,315 252,310 252,320" fill="#3b4c6b"/>
    <path d="M654 315 L668 315" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="676,315 666,310 666,320" fill="#3b4c6b"/>

    <!-- four feeds into detectors -->
    <path d="M140 350 L140 384" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="140,392 135,382 145,382" fill="#3b4c6b"/>
    <path d="M352 350 L352 384" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="352,392 347,382 357,382" fill="#3b4c6b"/>
    <path d="M559 350 L559 384" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="559,392 554,382 564,382" fill="#3b4c6b"/>
    <path d="M778 350 L778 384" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="778,392 773,382 783,382" fill="#3b4c6b"/>

    <!-- detectors -->
    <rect x="40" y="392" width="840" height="56" rx="11" fill="#16233a" stroke="#3a5a8f" stroke-width="1.6"/>
    <text x="460" y="417" font-size="13.5" font-weight="600" fill="#cfe0ff" text-anchor="middle">detectors</text>
    <text x="460" y="436" font-size="12" fill="#94a6c4" text-anchor="middle">queries first, and a model only for the judgments a query cannot make</text>

    <path d="M135 448 L135 476" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="135,484 130,474 140,474" fill="#3b4c6b"/>

    <!-- row 5: finding -> proposal -> approval -->
    <rect x="40" y="484" width="190" height="68" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="135" y="513" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">finding</text>
    <text x="135" y="532" font-size="12" fill="#94a6c4" text-anchor="middle">with typed evidence</text>

    <rect x="252" y="484" width="180" height="68" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="342" y="513" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">proposal</text>
    <text x="342" y="532" font-size="12" fill="#94a6c4" text-anchor="middle">carrying its evidence</text>

    <rect x="454" y="484" width="180" height="68" rx="11" fill="#2a2113" stroke="#f5a524" stroke-width="1.6"/>
    <text x="544" y="513" font-size="13.5" font-weight="600" fill="#ffd68a" text-anchor="middle">a person approves</text>
    <text x="544" y="532" font-size="12" fill="#c79a45" text-anchor="middle">the one step only people do</text>

    <rect x="656" y="484" width="170" height="68" rx="11" fill="#221520" stroke="#5a3340" stroke-width="1.4"/>
    <text x="741" y="513" font-size="13" font-weight="600" fill="#d4a3b0" text-anchor="middle">rejected</text>
    <text x="741" y="532" font-size="12" fill="#a3798a" text-anchor="middle">reviewer recorded</text>

    <path d="M230 518 L244 518" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="252,518 242,513 242,523" fill="#3b4c6b"/>
    <path d="M432 518 L446 518" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="454,518 444,513 444,523" fill="#3b4c6b"/>
    <path d="M634 518 L648 518" fill="none" stroke="#5a3340" stroke-width="1.8"/>
    <polygon points="656,518 646,513 646,523" fill="#5a3340"/>
    <text x="645" y="508" font-size="11" fill="#a3798a" text-anchor="middle">no</text>

    <!-- approval -> new version -->
    <path d="M544 552 L544 568 L385 568 L385 576" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="385,584 380,574 390,574" fill="#3b4c6b"/>
    <text x="556" y="566" font-size="11" fill="#7f92b0">yes</text>

    <!-- row 6: version -> verify -> compile -->
    <rect x="300" y="584" width="170" height="68" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="385" y="613" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">new version</text>
    <text x="385" y="632" font-size="12" fill="#94a6c4" text-anchor="middle">prior row closed, not lost</text>

    <rect x="492" y="584" width="200" height="68" rx="11" fill="#16233a" stroke="#2c3e5e"/>
    <text x="592" y="613" font-size="13" font-weight="600" fill="#c3d2ea" text-anchor="middle">checked before it ships</text>
    <text x="592" y="632" font-size="12" fill="#94a6c4" text-anchor="middle">against work already judged</text>

    <rect x="714" y="584" width="166" height="68" rx="11" fill="#16233a" stroke="#3a5a8f" stroke-width="1.6"/>
    <text x="797" y="613" font-size="13" font-weight="600" fill="#cfe0ff" text-anchor="middle">compiled artifact</text>
    <text x="797" y="632" font-size="12" fill="#94a6c4" text-anchor="middle">with provenance</text>

    <path d="M470 618 L484 618" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="492,618 482,613 482,623" fill="#3b4c6b"/>
    <path d="M692 618 L706 618" fill="none" stroke="#3b4c6b" stroke-width="1.8"/>
    <polygon points="714,618 704,613 704,623" fill="#3b4c6b"/>
  </g>
</svg>
