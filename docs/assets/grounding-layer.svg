<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">The grounding layer</title>
  <desc id="d">Raw material on the left feeds a governed middle layer with three parts: constraints, grounding data, and checks and feedback. The agent reads from that layer and its results feed back into it.</desc>

  <rect x="0" y="0" width="960" height="470" rx="16" fill="#0b1220"/>

  <text x="40" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf7">What sits between your raw data and the agent</text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <text x="40" y="96" font-size="12" font-weight="600" fill="#7f92b0" letter-spacing="1.1">RAW MATERIAL</text>
    <g font-size="13.5" fill="#a8b8d4">
      <rect x="36" y="112" width="172" height="44" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="139">documents</text>
      <rect x="36" y="168" width="172" height="44" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="195">agent transcripts</text>
      <rect x="36" y="224" width="172" height="44" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="251">event streams</text>
      <rect x="36" y="280" width="172" height="44" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="307">what experts know</text>
    </g>

    <!-- feed arrow -->
    <line x1="214" y1="215" x2="244" y2="215" stroke="#3b4c6b" stroke-width="2"/>
    <polygon points="252,215 242,210 242,220" fill="#3b4c6b"/>

    <!-- the layer -->
    <rect x="258" y="82" width="424" height="316" rx="14" fill="#111a2b" stroke="#2c4370" stroke-width="1.8"/>
    <text x="282" y="112" font-size="16" font-weight="600" fill="#e6edf7">The grounding layer</text>
    <text x="282" y="132" font-size="12.5" fill="#7f92b0">governed, versioned, every change traceable</text>

    <rect x="282" y="146" width="376" height="72" rx="10" fill="#16233a" stroke="#2c3e5e"/>
    <text x="302" y="172" font-size="14" font-weight="600" fill="#89b4f7">constraints</text>
    <text x="302" y="194" font-size="13" fill="#94a6c4">rules, policies, and when each skill applies</text>

    <rect x="282" y="228" width="376" height="72" rx="10" fill="#16233a" stroke="#2c3e5e"/>
    <text x="302" y="254" font-size="14" font-weight="600" fill="#89b4f7">grounding data</text>
    <text x="302" y="276" font-size="13" fill="#94a6c4">checked knowledge, its evidence, where it came from</text>

    <rect x="282" y="310" width="376" height="72" rx="10" fill="#16233a" stroke="#2c3e5e"/>
    <text x="302" y="336" font-size="14" font-weight="600" fill="#89b4f7">checks and feedback</text>
    <text x="302" y="358" font-size="13" fill="#94a6c4">gates before shipping, corrections, usage signals</text>

    <!-- to agent -->
    <line x1="688" y1="215" x2="726" y2="215" stroke="#3b4c6b" stroke-width="2"/>
    <polygon points="734,215 724,210 724,220" fill="#3b4c6b"/>

    <rect x="742" y="168" width="180" height="94" rx="12" fill="#141d2f" stroke="#3a5a8f" stroke-width="1.6"/>
    <text x="832" y="200" font-size="15" font-weight="600" fill="#e6edf7" text-anchor="middle">the agent</text>
    <text x="832" y="224" font-size="12.5" fill="#8fa2c0" text-anchor="middle">loads only the part</text>
    <text x="832" y="242" font-size="12.5" fill="#8fa2c0" text-anchor="middle">it needs right now</text>

    <!-- feedback return path -->
    <path d="M832 268 L832 426 L470 426 L470 406" fill="none" stroke="#f5a524" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.75"/>
    <polygon points="470,398 465,410 475,410" fill="#f5a524" opacity="0.75"/>
    <text x="652" y="446" font-size="12.5" fill="#c99a3e" text-anchor="middle">what it did, what was wrong, what helped — goes back in</text>
  </g>
</svg>
