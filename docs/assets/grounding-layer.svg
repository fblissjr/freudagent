<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="t d">
  <title id="t">The grounding layer</title>
  <desc id="d">Raw material feeds a governed layer with constraints on both sides: left-hand constraints saying what the agent may and must do, grounding data in the middle, and right-hand constraints defining what good means. The agent reads from that layer and its results feed back in.</desc>

  <rect x="0" y="0" width="960" height="486" rx="16" fill="#0b1220"/>

  <text x="40" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf7">Constraints on both sides, data in between</text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <text x="40" y="96" font-size="12" font-weight="600" fill="#7f92b0" letter-spacing="1.1">RAW MATERIAL</text>
    <g font-size="13.5" fill="#a8b8d4">
      <rect x="36" y="112" width="172" height="42" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="138">documents</text>
      <rect x="36" y="164" width="172" height="42" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="190">records and events</text>
      <rect x="36" y="216" width="172" height="42" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="242">agent runs</text>
      <rect x="36" y="268" width="172" height="42" rx="9" fill="#141d2f" stroke="#26334c"/>
      <text x="56" y="294">what experts know</text>
    </g>

    <line x1="214" y1="215" x2="244" y2="215" stroke="#3b4c6b" stroke-width="2"/>
    <polygon points="252,215 242,210 242,220" fill="#3b4c6b"/>

    <!-- the layer -->
    <rect x="258" y="82" width="424" height="330" rx="14" fill="#111a2b" stroke="#2c4370" stroke-width="1.8"/>
    <text x="282" y="112" font-size="16" font-weight="600" fill="#e6edf7">The grounding layer</text>
    <text x="282" y="132" font-size="12.5" fill="#7f92b0">governed, versioned, every change traceable</text>

    <!-- left-hand constraints -->
    <rect x="282" y="146" width="376" height="76" rx="10" fill="#16233a" stroke="#4f8ef7" stroke-width="1.6"/>
    <text x="302" y="168" font-size="10.5" font-weight="600" fill="#6f83a3" letter-spacing="1">LEFT-HAND CONSTRAINTS</text>
    <text x="302" y="190" font-size="14" font-weight="600" fill="#89b4f7">what it may and must do</text>
    <text x="302" y="210" font-size="12.5" fill="#94a6c4">rules, policies, when each skill applies</text>

    <!-- grounding data -->
    <rect x="282" y="232" width="376" height="76" rx="10" fill="#16233a" stroke="#2c3e5e" stroke-width="1.2"/>
    <text x="302" y="254" font-size="10.5" font-weight="600" fill="#6f83a3" letter-spacing="1">IN BETWEEN</text>
    <text x="302" y="276" font-size="14" font-weight="600" fill="#c3d2ea">grounding data</text>
    <text x="302" y="296" font-size="12.5" fill="#94a6c4">checked knowledge, its evidence, its provenance</text>

    <!-- right-hand constraints -->
    <rect x="282" y="318" width="376" height="76" rx="10" fill="#16233a" stroke="#4f8ef7" stroke-width="1.6"/>
    <text x="302" y="340" font-size="10.5" font-weight="600" fill="#6f83a3" letter-spacing="1">RIGHT-HAND CONSTRAINTS</text>
    <text x="302" y="362" font-size="14" font-weight="600" fill="#89b4f7">what good means</text>
    <text x="302" y="382" font-size="12.5" fill="#94a6c4">success criteria, eval gates, corrections, deviation</text>

    <line x1="688" y1="215" x2="726" y2="215" stroke="#3b4c6b" stroke-width="2"/>
    <polygon points="734,215 724,210 724,220" fill="#3b4c6b"/>

    <rect x="742" y="168" width="180" height="94" rx="12" fill="#141d2f" stroke="#3a5a8f" stroke-width="1.6"/>
    <text x="832" y="200" font-size="15" font-weight="600" fill="#e6edf7" text-anchor="middle">the agent</text>
    <text x="832" y="224" font-size="12.5" fill="#8fa2c0" text-anchor="middle">loads only the part</text>
    <text x="832" y="242" font-size="12.5" fill="#8fa2c0" text-anchor="middle">it needs right now</text>

    <path d="M832 268 L832 440 L470 440 L470 420" fill="none" stroke="#f5a524" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.75"/>
    <polygon points="470,412 465,424 475,424" fill="#f5a524" opacity="0.75"/>
    <text x="652" y="462" font-size="12.5" fill="#c99a3e" text-anchor="middle">what it did, what was judged wrong, where it departed from the guidance — all goes back in</text>
  </g>
</svg>
