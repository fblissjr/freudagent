<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">One turn of the data flywheel</title>
  <desc id="d">Six stages in a loop: ingest, analyze, propose, approve, compile, verify. A pulse travels the loop and each stage is explained in turn. Approve is done by a person and cannot be automated.</desc>

  <rect x="0" y="0" width="960" height="560" rx="16" fill="#0b1220"/>

  <text x="44" y="52" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf7">One turn of the data flywheel</text>
  <text x="44" y="78" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8fa2c0">The agent runs, the system watches, a person approves, the agent gets better. Then it repeats.</text>

  <!-- ring track -->
  <circle cx="280" cy="300" r="125" fill="none" stroke="#22304a" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- direction arrowheads -->
  <g fill="#4d6288">
    <polygon points="349.4,195.8 341.5,185.4 336.5,194.1"/>
    <polygon points="405,308 410,296 400,296"/>
    <polygon points="335.6,412.3 348.5,410.6 343.5,401.9"/>
    <polygon points="210.6,404.3 218.5,414.6 223.5,405.9"/>
    <polygon points="155,292 150,304 160,304"/>
    <polygon points="224.4,187.8 211.5,189.4 216.5,198.1"/>
  </g>

  <!-- travelling pulse -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-90 280 300;270 280 300" dur="18s" repeatCount="indefinite"/>
    <circle cx="405" cy="300" r="9" fill="#7cc4ff" opacity="0.25"/>
    <circle cx="405" cy="300" r="4.5" fill="#bfe0ff"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">

    <!-- 0 ingest -->
    <circle cx="280" cy="175" r="40" fill="#16233a" stroke="#2c3e5e" stroke-width="1.5"/>
    <text x="280" y="180" fill="#8fa2c0">ingest</text>
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.156;0.167;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="280" cy="175" r="46" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.4"/>
      <circle cx="280" cy="175" r="40" fill="#1b2c4d" stroke="#4f8ef7" stroke-width="2"/>
      <text x="280" y="180" fill="#e6edf7">ingest</text>
    </g>

    <!-- 1 analyze -->
    <circle cx="388.3" cy="237.5" r="40" fill="#16233a" stroke="#2c3e5e" stroke-width="1.5"/>
    <text x="388.3" y="242.5" fill="#8fa2c0">analyze</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.178;0.322;0.333;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="388.3" cy="237.5" r="46" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.4"/>
      <circle cx="388.3" cy="237.5" r="40" fill="#1b2c4d" stroke="#4f8ef7" stroke-width="2"/>
      <text x="388.3" y="242.5" fill="#e6edf7">analyze</text>
    </g>

    <!-- 2 propose -->
    <circle cx="388.3" cy="362.5" r="40" fill="#16233a" stroke="#2c3e5e" stroke-width="1.5"/>
    <text x="388.3" y="367.5" fill="#8fa2c0">propose</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.344;0.489;0.5;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="388.3" cy="362.5" r="46" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.4"/>
      <circle cx="388.3" cy="362.5" r="40" fill="#1b2c4d" stroke="#4f8ef7" stroke-width="2"/>
      <text x="388.3" y="367.5" fill="#e6edf7">propose</text>
    </g>

    <!-- 3 approve (human) -->
    <circle cx="280" cy="425" r="40" fill="#2a2113" stroke="#7a5a1e" stroke-width="1.5"/>
    <text x="280" y="422" fill="#d9a94a">approve</text>
    <text x="280" y="438" fill="#8a7038" font-size="10.5" font-weight="500">a person</text>
    <circle cx="280" cy="425" r="46" fill="none" stroke="#f5a524" stroke-width="1.5" opacity="0.35">
      <animate attributeName="r" values="46;53;46" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.511;0.656;0.667;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="280" cy="425" r="40" fill="#3a2c12" stroke="#f5a524" stroke-width="2.5"/>
      <text x="280" y="422" fill="#ffd68a">approve</text>
      <text x="280" y="438" fill="#c79a45" font-size="10.5" font-weight="500">a person</text>
    </g>

    <!-- 4 compile -->
    <circle cx="171.7" cy="362.5" r="40" fill="#16233a" stroke="#2c3e5e" stroke-width="1.5"/>
    <text x="171.7" y="367.5" fill="#8fa2c0">compile</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.678;0.822;0.833;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="171.7" cy="362.5" r="46" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.4"/>
      <circle cx="171.7" cy="362.5" r="40" fill="#1b2c4d" stroke="#4f8ef7" stroke-width="2"/>
      <text x="171.7" y="367.5" fill="#e6edf7">compile</text>
    </g>

    <!-- 5 verify -->
    <circle cx="171.7" cy="237.5" r="40" fill="#16233a" stroke="#2c3e5e" stroke-width="1.5"/>
    <text x="171.7" y="242.5" fill="#8fa2c0">verify</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.844;0.989;1;1" dur="18s" repeatCount="indefinite"/>
      <circle cx="171.7" cy="237.5" r="46" fill="none" stroke="#35c88f" stroke-width="1.5" opacity="0.4"/>
      <circle cx="171.7" cy="237.5" r="40" fill="#14332a" stroke="#35c88f" stroke-width="2"/>
      <text x="171.7" y="242.5" fill="#c9f5e3">verify</text>
    </g>
  </g>

  <!-- explanation panel -->
  <rect x="500" y="140" width="420" height="290" rx="14" fill="#111a2b" stroke="#22304a" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- 0 ingest -->
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.156;0.167;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#4f8ef7" letter-spacing="1.2">STAGE 1</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#e6edf7">Ingest</text>
      <text x="530" y="256" font-size="14" fill="#a8b8d4">Everything the system does gets recorded.</text>
      <text x="530" y="278" font-size="14" fill="#a8b8d4">Agent transcripts, event streams, documents —</text>
      <text x="530" y="300" font-size="14" fill="#a8b8d4">all ingested into one warehouse. Keys come from</text>
      <text x="530" y="322" font-size="14" fill="#a8b8d4">stable identifiers, so re-running ingest</text>
      <text x="530" y="344" font-size="14" fill="#a8b8d4">never duplicates anything.</text>
    </g>

    <!-- 1 analyze -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.178;0.322;0.333;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#4f8ef7" letter-spacing="1.2">STAGE 2</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#e6edf7">Analyze</text>
      <text x="530" y="256" font-size="14" fill="#a8b8d4">Plain SQL detectors scan for patterns that</text>
      <text x="530" y="278" font-size="14" fill="#a8b8d4">repeat: a field corrected the same way twelve</text>
      <text x="530" y="300" font-size="14" fill="#a8b8d4">times, a source that changed underneath you.</text>
      <text x="530" y="322" font-size="14" fill="#a8b8d4">Cheap and repeatable. No model calls — a model</text>
      <text x="530" y="344" font-size="14" fill="#a8b8d4">is only asked for judgment calls.</text>
    </g>

    <!-- 2 propose -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.344;0.489;0.5;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#4f8ef7" letter-spacing="1.2">STAGE 3</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#e6edf7">Propose</text>
      <text x="530" y="256" font-size="14" fill="#a8b8d4">A pattern with enough evidence behind it</text>
      <text x="530" y="278" font-size="14" fill="#a8b8d4">becomes a written proposal: change this rule,</text>
      <text x="530" y="300" font-size="14" fill="#a8b8d4">add this instruction. Every proposal links to</text>
      <text x="530" y="322" font-size="14" fill="#a8b8d4">the exact rows that justify it, so a reviewer</text>
      <text x="530" y="344" font-size="14" fill="#a8b8d4">can check the claim instead of trusting it.</text>
    </g>

    <!-- 3 approve -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.511;0.656;0.667;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#f5a524" letter-spacing="1.2">STAGE 4</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#ffd68a">Approve</text>
      <text x="530" y="256" font-size="14" fill="#d8c69c">A person reads the proposal and says yes or no.</text>
      <text x="530" y="278" font-size="14" fill="#d8c69c">Nothing reaches the agent's context without</text>
      <text x="530" y="300" font-size="14" fill="#d8c69c">this step. The agent can draft a change, but it</text>
      <text x="530" y="322" font-size="14" fill="#d8c69c">cannot switch one on for itself — the tools it</text>
      <text x="530" y="344" font-size="14" fill="#d8c69c">can call refuse to create anything that loads.</text>
      <rect x="530" y="376" width="128" height="24" rx="12" fill="#2a2113" stroke="#7a5a1e"/>
      <text x="594" y="392" font-size="12" font-weight="600" fill="#e0b45e" text-anchor="middle">human only, always</text>
    </g>

    <!-- 4 compile -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.678;0.822;0.833;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#4f8ef7" letter-spacing="1.2">STAGE 5</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#e6edf7">Compile</text>
      <text x="530" y="256" font-size="14" fill="#a8b8d4">An approved change creates a new version of the</text>
      <text x="530" y="278" font-size="14" fill="#a8b8d4">rule or skill, and compiles into the markdown</text>
      <text x="530" y="300" font-size="14" fill="#a8b8d4">files the agent actually loads. Each file says</text>
      <text x="530" y="322" font-size="14" fill="#a8b8d4">do not edit me, and carries a footer naming the</text>
      <text x="530" y="344" font-size="14" fill="#a8b8d4">evidence and the approval behind it.</text>
    </g>

    <!-- 5 verify -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.844;0.989;1;1" dur="18s" repeatCount="indefinite"/>
      <text x="530" y="186" font-size="12" font-weight="600" fill="#35c88f" letter-spacing="1.2">STAGE 6</text>
      <text x="530" y="218" font-size="24" font-weight="600" fill="#c9f5e3">Verify</text>
      <text x="530" y="256" font-size="14" fill="#9fc9bb">Before a new version ships, it is run against</text>
      <text x="530" y="278" font-size="14" fill="#9fc9bb">work that was already reviewed and marked</text>
      <text x="530" y="300" font-size="14" fill="#9fc9bb">correct. It has to fix the thing it targeted and</text>
      <text x="530" y="322" font-size="14" fill="#9fc9bb">break nothing else. Otherwise the last good</text>
      <text x="530" y="344" font-size="14" fill="#9fc9bb">version keeps serving.</text>
    </g>
  </g>

  <text x="480" y="500" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c3d2ea" text-anchor="middle">Each turn leaves the knowledge base better than the last one found it.</text>
  <text x="480" y="524" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7f92b0" text-anchor="middle">That compounding is the only thing the word flywheel means here.</text>
</svg>
